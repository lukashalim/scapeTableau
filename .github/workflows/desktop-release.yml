name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tableauhyperapi pyinstaller

      - name: Build convert sidecar (PyInstaller)
        run: pyinstaller desktop/convert_cli.spec --noconfirm --clean

      - name: Install desktop-app deps
        working-directory: desktop-app
        run: npm ci

      - name: Sync app version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".Replace("desktop-v", "")
          $pkg = "desktop-app/package.json"
          $json = Get-Content $pkg -Raw | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 100 | Set-Content $pkg

      - name: Build Electron app + NSIS installer
        working-directory: desktop-app
        run: npm run pack:win
        env:
          # Unsigned v1 — skip code signing
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BIEscape-Converter-Setup-windows-x64
          path: desktop-app/release/BIEscape-Converter-Setup-windows-x64.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'BIEscape-Converter-Setup-windows-x64.exe' -exec cp {} release-assets/ \;
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BIEscape Converter ${{ github.ref_name }}
          body: |
            Unsigned Windows build of **BIEscape Converter** (Electron + local Hyper / TWBX / TDSX → Excel + SQL transpile).

            ### Windows
            Download **[BIEscape-Converter-Setup-windows-x64.exe](https://github.com/lukashalim/scapeTableau/releases/latest/download/BIEscape-Converter-Setup-windows-x64.exe)** and run the installer.
            SmartScreen may warn — **More info → Run anyway**.

            Conversion runs entirely offline via a bundled Python sidecar (`tableauhyperapi` / hyperd). Hosted biescape.com stays list-only for Hyper.

            ### Sidecar SQL (this release)
            Includes EscapeTableau SQL generator fixes from `main` (PR #9): multipart `"Extract"."Extract"` quoting, bare `NULL`, float noise collapse (`18.4`), preserved caption characters, and dialect-aware date/boolean SQL.
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
